name: tests

# The whole suite on every push to main (slice S0 of backlog 0301): the refusal of every documented
# write path is the only guard between this service and the books (spec §2.5), so it runs on its own,
# not only when a session remembers to. The store's SQL runs against a real Postgres: those tests skip
# without TEST_DATABASE_URL. Push runs on main only, as in analiza-metrics (2026-10-22): the account has
# 2,000 free Actions minutes a month and no budget beyond them; a branch is checked locally first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # a throwaway database inside the job; no secret, nothing shared with any deployment
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
